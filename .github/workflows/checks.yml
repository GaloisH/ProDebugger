name: Checks

on:
  push:
    branches: ["data/publish-benchmark-traces"]
  pull_request:
    branches: ["data/publish-benchmark-traces"]
  workflow_dispatch:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run regression checks
        run: python -m pytest checks -q
      - name: Run offline examples
        run: python -B inspect_examples.py
